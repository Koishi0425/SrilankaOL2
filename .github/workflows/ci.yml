name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node infrastructure/scripts/smoke-deploy.mjs

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: srilanka
          POSTGRES_PASSWORD: srilanka
          POSTGRES_DB: srilanka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srilanka -d srilanka_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://srilanka:srilanka@localhost:5432/srilanka_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm --filter @srilanka/api test:integration
      - run: pnpm --filter @srilanka/database test:integration
        env:
          POSTGRES_COMMAND_PREFIX_JSON: '["docker","exec","-i","-e","PGHOST","-e","PGPORT","-e","PGUSER","-e","PGPASSWORD","-e","PGDATABASE","-e","PGCONNECT_TIMEOUT","${{ job.services.postgres.id }}"]'

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, docker-smoke]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, web, worker]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Image namespace
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.component }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  release-images:
    needs: publish-images
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge architecture manifests
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          namespace="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          for component in api web worker; do
            docker buildx imagetools create --tag "$namespace-$component:sha-$GITHUB_SHA" \
              "$namespace-$component:sha-$GITHUB_SHA-amd64" \
              "$namespace-$component:sha-$GITHUB_SHA-arm64"
          done
      - name: Verify images pulled from GHCR
        run: node infrastructure/scripts/smoke-deploy.mjs --registry --image-tag sha-${{ github.sha }}
      - name: Promote verified images to latest
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          namespace="ghcr.io/${REPOSITORY,,}"
          for component in api web worker; do
            docker buildx imagetools create --tag "$namespace-$component:latest" "$namespace-$component:sha-$GITHUB_SHA"
          done
